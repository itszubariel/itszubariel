name: Metrics
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics-light.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: activity, repositories, metadata
          config_octicon: no
          plugin_languages: yes
          plugin_languages_limit: 5

      - uses: lowlighter/metrics@latest
        with:
          filename: metrics-dark.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: activity, repositories, metadata
          config_octicon: no
          plugin_languages: yes
          plugin_languages_limit: 5
          query: |
            theme=dark